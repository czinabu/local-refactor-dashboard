[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults

[tool.ruff.lint.per-file-ignores]
"refactor_dashboard/prompts.py" = ["E501"]  # prompt text kept verbatim
